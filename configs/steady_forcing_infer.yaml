generator_ckpt: ./ckpt/minar09/Steady-Forcing-T2V-1.3B/steady_forcing_t2v.pt
generator_fsdp_wrap_strategy: size
real_score_fsdp_wrap_strategy: size
fake_score_fsdp_wrap_strategy: size
real_name: Wan2.1-T2V-1.3B
text_encoder_fsdp_wrap_strategy: size
denoising_step_list:
- 1000
- 750
- 500
- 250
warp_denoising_step: true   # need to remove - 0 in denoising_step_list if warp_denoising_step is true
ts_schedule: false
num_train_timestep: 1000
timestep_shift: 5.0
guidance_scale: 5.0
denoising_loss_type: flow
mixed_precision: true
seed: 0
wandb_host: WANDB_HOST
wandb_key: WANDB_KEY
wandb_entity: WANDB_ENTITY
wandb_project: WANDB_PROJECT
sharding_strategy: hybrid_full
lr: 2.0e-06
lr_critic: 4.0e-07
beta1: 0.0
beta2: 0.999
beta1_critic: 0.0
beta2_critic: 0.999
data_path: prompts/sbench/static_nature_prompts_test.txt
batch_size: 1
ema_weight: 0.99
ema_start_step: 200
total_batch_size: 64
log_iters: 500
negative_prompt: '色调艳丽，过曝，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走, solid water, metallic water, water stagnation, color drift, water flow drift, water color drift, water surface drift, scene drift, background drift, frozen motion, camera movement, zooming, panning, camera drift, visual artifacts, camera, tripod,  ground artifacts, anomalous textures, unrealistic round shaped pattern, localized distortions, unnatural water, unnatural waves, unnatural flow, unnatural motion, unnatural physics, unnatural dynamics, unnatural fluidity, unnatural surface, unnatural reflections, unnatural refractions, unnatural transparency, unnatural opacity, unnatural viscosity, unnatural turbulence, unnatural splashes, unnatural ripples, unnatural foam, unnatural spray, unnatural mist, unnatural droplets, human, animal, repetitive round textures, pond effects, low dynamic degree, unnatural color, unnatural lighting, unnatural shadows, unnatural highlights, unnatural contrast, unnatural saturation, unnatural hue, unnatural brightness, unnatural darkness, unnatural exposure, unnatural noise, unnatural grain, unnatural blur, unnatural sharpness, unnatural clarity, unnatural detail, unnatural texture, unnatural pattern, unnatural composition'
dfake_gen_update_ratio: 5
image_or_video_shape:
- 1
- 21
- 16
- 60
- 104

# DMD Specifics
distribution_loss: dmd    # remove rewardeddmd
trainer: score_distillation    # remove rewarded_distillation
beta: 0.5            # Optimal balance between motion and quality [11]
generator_update_ratio: 5    # Update generator 5 times per 1 critic update [13]
checkpoint_path: ../ckpt

gradient_checkpointing: true    # Enable for memory savings, but may slow down training
num_frame_per_block: 6    # 6 for inference, 3 for training to reduce memory
num_training_frames: 21
load_raw_video: false
text_encoder_cpu_offload: true

# For Static Scenery Stability
model_kwargs:
  sink_size: 3               # 1 static anchor token + 2 EMA-updated dynamic tokens
  local_attn_size: 18        # Sliding window (native horizon is 21, so 18 + 3 sinks)
  timestep_shift: 5.0        # Standard for Wan2.1-1.3B
  # compression_alpha: 0.99     # ADD: match inference EMA config
